name: ShellCheck

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned ShellCheck
        run: |
          curl -sSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz"
          tar -C /tmp -xf /tmp/shellcheck.tar.xz
          sudo mv /tmp/shellcheck-v0.10.0/shellcheck /usr/local/bin/
      - name: Run ShellCheck
        run: shellcheck -S style ani-cli install.sh uninstall.sh